# 로컬 개발용 PostgreSQL + pgvector 컨테이너.
# pgvector 확장이 미리 설치된 이미지를 사용해 별도 빌드 없이 임베딩 유사도 매칭(vector 타입)을 바로 쓸 수 있게 한다.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: career-copilot-db
    restart: unless-stopped
    environment:
      # .env.example의 DATABASE_URL과 반드시 일치해야 한다.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_copilot
    ports:
      - "5432:5432"
    volumes:
      # 컨테이너를 내렸다 올려도 데이터가 유지되도록 named volume에 저장.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # FastAPI가 DB보다 먼저 뜨는 경우를 대비해 '/health'가 참조할 수 있는 상태 체크.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
